# Keeps dependencies and GitHub Actions patched. Electron updates matter most:
# each release ships Chromium security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native compiler rewrite; typescript-eslint and
      # electron-vite need to support it first. Upgrade it by hand when they do.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
